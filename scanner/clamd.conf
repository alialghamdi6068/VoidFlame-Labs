# ClamAV daemon configuration for 100 MB platform uploads.
# Mounted only into the scanner container; the daemon is not published to the host.
LogTime yes
Foreground yes
TCPSocket 3310
TCPAddr 0.0.0.0
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
User clamav
StreamMaxLength 120M
MaxFileSize 120M
MaxScanSize 500M
MaxRecursion 20
MaxFiles 20000
