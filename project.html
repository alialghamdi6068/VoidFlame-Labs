<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111113"><title>Project — VoidFlame Labs</title><style>
:root{color-scheme:dark;--bg:#101012;--panel:#19191e;--line:#303039;--text:#f4f2f8;--muted:#aaa7b5;--purple:#a78bfa;--mint:#8fe5c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#30204d,transparent 45%),var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}a{color:inherit;text-decoration:none}button,.btn{border:1px solid var(--line);border-radius:11px;background:#202027;color:var(--text);padding:10px 14px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}button:hover,.btn:hover{border-color:var(--purple)}.primary{background:var(--purple);color:#17121f;border-color:transparent;font-weight:750}.shell{width:min(1160px,calc(100% - 32px));margin:auto}header{height:70px;border-bottom:1px solid #ffffff13;display:flex;align-items:center;justify-content:space-between}.brand{font-weight:850}.mark{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--purple);color:#17121f;margin-right:9px}.nav{display:flex;gap:18px;color:var(--muted);font-size:14px}.muted{color:var(--muted)}.hero{padding:42px 0 28px;display:grid;grid-template-columns:92px 1fr;gap:22px}.logo{width:92px;height:92px;border-radius:22px;background:linear-gradient(145deg,#302640,#24242b);display:grid;place-items:center;font-size:38px;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.kicker{color:var(--mint);font-size:11px;font-weight:800;letter-spacing:1.7px}.title{font-size:clamp(30px,5vw,48px);letter-spacing:-1.5px;line-height:1.15;margin:5px 0}.summary{color:#d2cfda;font-size:17px;max-width:740px}.actions,.stats,.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.stats{color:var(--muted);font-size:13px;gap:20px}.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow:auto}.tab{border:0;background:transparent;color:var(--muted);white-space:nowrap;border-radius:10px 10px 0 0}.tab.active{color:var(--text);border-bottom:2px solid var(--purple);background:#a78bfa12}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;padding:22px 0 55px}.panel{border:1px solid var(--line);background:#17171bcc;border-radius:16px;padding:21px;min-width:0}.panel h2{font-size:18px;margin:0 0 14px}.description{white-space:pre-wrap;overflow-wrap:anywhere;color:#d2cfda}.meta{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff0c;font-size:13px}.meta span{color:var(--muted)}.meta strong{text-align:right;overflow-wrap:anywhere}.version,.comment{border:1px solid var(--line);background:#1b1b21;border-radius:12px;padding:14px;margin:10px 0}.version-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{display:inline-block;border:1px solid #a78bfa42;background:#a78bfa12;color:#d9ccff;border-radius:8px;padding:3px 8px;font-size:11px}.empty,.notice{padding:20px;border:1px dashed #45434d;border-radius:13px;color:var(--muted);text-align:center}.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.gallery img,.gallery video{width:100%;max-height:340px;object-fit:cover;border-radius:12px;background:#222}.field{display:block;width:100%;min-height:90px;background:#101014;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:11px;margin:12px 0;font:inherit}.status{color:var(--mint);font-size:13px}footer{border-top:1px solid var(--line);padding:24px 0;color:var(--muted);font-size:12px}@media(max-width:760px){.hero{grid-template-columns:65px 1fr;gap:14px;padding-top:26px}.logo{width:65px;height:65px;border-radius:16px;font-size:28px}.layout{grid-template-columns:1fr}.gallery{grid-template-columns:1fr}.panel{padding:16px}.nav{gap:10px}.title{letter-spacing:-.8px}}
</style><script src="./config.js"></script></head><body><header class="shell"><a class="brand" href="./"><span class="mark">V</span>VoidFlame Labs</a><nav class="nav"><a href="./#discover">Discover</a><a href="./developer.html">Developer</a><a href="./profile.html">Profile</a><a href="https://github.com/alialghamdi6068/VoidFlame-Labs">GitHub ↗</a></nav></header><main class="shell"><div id="state" class="notice" style="margin-top:30px">Loading project…</div><section id="page" hidden><div class="hero"><div id="logo" class="logo">✦</div><div><div id="category" class="kicker">PROJECT</div><h1 id="name" class="title">Project</h1><div id="author" class="muted"></div><p id="summary" class="summary"></p><div id="actions" class="actions"></div><div id="stats" class="stats"></div></div></div><div class="tabs" role="tablist"><button class="tab active" data-tab="overview">Overview</button><button class="tab" data-tab="versions">Versions</button><button class="tab" data-tab="gallery">Gallery</button><button class="tab" data-tab="changelog">Changelog</button><button class="tab" data-tab="community">Community</button></div><div id="content" class="layout"></div></section></main><footer><div class="shell">VoidFlame Labs · Discover, build, and share Minecraft projects.</div></footer><script>
const API=(window.VOIDFLAME_CONFIG?.apiBaseUrl||"").replace(/\/$/,""),$=id=>document.getElementById(id);let p,versions=[],comments=[],tab="overview";
const el=(tag,cls,text)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n};
const github=v=>{try{const u=new URL(v);return u.protocol==="https:"&&u.hostname==="github.com"?u.href:""}catch{return ""}};
async function api(path,opts={}){if(!API)throw Error("API is not configured");const r=await fetch(API+path,{credentials:"include",...opts,headers:{"content-type":"application/json",...(opts.headers||{})}}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function link(parent,label,url,primary=false){if(!url)return;const a=el("a","btn"+(primary?" primary":""),label);a.href=url;a.target="_blank";a.rel="noopener noreferrer";parent.append(a)}
function panel(title){const n=el("section","panel");n.append(el("h2","",title));return n}
function meta(k,v){const n=el("div","meta");n.append(el("span","",k),el("strong","",v||"Not specified"));return n}
function list(v){if(Array.isArray(v))return v;try{return JSON.parse(v||"[]")}catch{return []}}
async function action(type){try{const d=await api("/api/projects/"+encodeURIComponent(p.slug)+"/"+type,{method:"POST",body:"{}"});$("communityStatus").textContent=d.active?"Saved.":"Removed."}catch(e){alert(e.message)}}
function render(which){tab=which;document.querySelectorAll("[data-tab]").forEach(b=>b.classList.toggle("active",b.dataset.tab===which));const root=$("content");root.replaceChildren();
if(which==="overview"){const a=panel("About this project");a.append(el("div","description",p.description||p.summary||"No full description provided."));if(p.requirements)a.append(el("h2","","Requirements"),el("div","description",p.requirements));const b=panel("Project information");[["Category",p.category],["Creator",p.author||p.username],["Latest version",p.version||versions[0]?.version_number],["Downloads",Number(p.downloads||0).toLocaleString()],["Updated",p.updated_at||p.updatedAt],["Supported versions",list(p.supportedVersions).join(", ")]].forEach(x=>b.append(meta(...x)));root.append(a,b)}
if(which==="versions"||which==="changelog"){const a=panel(which==="versions"?"All versions":"Release changelog");if(!versions.length)a.append(el("div","empty","No version records published yet."));versions.forEach(v=>{const n=el("article","version"),top=el("div","version-top");top.append(el("strong","",v.version_number||v.version||"Version"),el("span","tag",(v.channel||"release").toUpperCase()));n.append(top,el("p","muted",(v.created_at||"")+(v.file_name?" · "+v.file_name:"")+(v.file_size?" · "+(v.file_size/1048576).toFixed(2)+" MB":"")),el("div","description",v.changelog||"No changelog provided."),el("p","muted","Minecraft: "+list(v.game_versions).join(", ")+" · Loaders: "+list(v.loaders).join(", ")));link(n,"Open release ↗",github(v.release_url),true);if(v.id&&API){const d=el("button","","Download file ↓");d.onclick=()=>location.href=API+"/api/versions/"+encodeURIComponent(v.id)+"/download";n.append(d)}a.append(n)});root.append(a)}
if(which==="gallery"){const a=panel("Project gallery"),items=list(p.gallery);if(!items.length)a.append(el("div","empty","No gallery images or videos have been added yet."));else{const g=el("div","gallery");items.forEach(item=>{const src=typeof item==="string"?item:item.url;try{const u=new URL(src);if(!["https:","http:"].includes(u.protocol))return;const n=/\.(mp4|webm)(\?|$)/i.test(u.href)?el("video",""):el("img","");n.src=u.href;if(n.tagName==="VIDEO"){n.controls=true;n.preload="metadata"}else n.alt=(item.alt||p.name);g.append(n)}catch{}});a.append(g)}root.append(a)}
if(which==="community"){const a=panel("Community discussion");a.append(el("p","muted","Keep comments useful and respectful."));const row=el("div","row");row.append(Object.assign(el("button","","☆ Favorite"),{onclick:()=>action("favorite")}),Object.assign(el("button","","＋ Follow"),{onclick:()=>action("follow")}));a.append(row);const form=el("form",""),area=el("textarea","field");area.placeholder="Share feedback…";area.maxLength=3000;area.required=true;const send=el("button","primary","Post comment");send.type="submit";form.append(area,send);form.onsubmit=async e=>{e.preventDefault();try{await api("/api/projects/"+encodeURIComponent(p.slug)+"/comments",{method:"POST",body:JSON.stringify({body:area.value})});area.value="";const d=await api("/api/projects/"+encodeURIComponent(p.slug));comments=d.comments||[];render("community")}catch(e){alert(e.message)}};a.append(form,el("div","status",""));const status=el("div","status");status.id="communityStatus";a.append(status);comments.forEach(c=>{const n=el("article","comment");n.append(el("strong","",c.username||"Community member"),el("p","muted",c.created_at||""),el("div","description",c.body));const r=el("button","","Report comment");r.onclick=()=>report("Comment ID: "+c.id);n.append(r);a.append(n)});const rp=el("button","","Report project");rp.onclick=()=>report("");a.append(rp);root.append(a)}}
async function report(details){const reason=prompt("Reason for report");if(!reason)return;try{await api("/api/projects/"+encodeURIComponent(p.slug)+"/report",{method:"POST",body:JSON.stringify({reason,details})});alert("Report submitted")}catch(e){alert(e.message)}}
async function load(){const slug=new URLSearchParams(location.search).get("slug");try{if(!slug)throw Error("Project not specified");if(API){try{const d=await api("/api/projects/"+encodeURIComponent(slug));p=d.project;versions=d.versions||[];comments=d.comments||[]}catch(e){console.warn("API fallback",e.message)}}if(!p){const r=await fetch("./data/projects.json");if(!r.ok)throw Error("Catalogue unavailable");const d=await r.json();p=(Array.isArray(d)?d:d.projects||[]).find(x=>String(x.slug||x.id||x.name)===slug);if(!p)throw Error("Project not found");versions=list(p.versions)}p.slug=p.slug||slug;const icon=p.icon_url||p.iconUrl||p.icon;if(icon&&/^https:\/\//i.test(icon)){const img=el("img","");img.src=icon;img.alt="";$("logo").replaceChildren(img)}else $("logo").textContent=icon||"✦";$("category").textContent=p.category||"PROJECT";$("name").textContent=p.name||"Untitled project";$("author").textContent="by "+(p.author||p.username||"Community creator");$("summary").textContent=p.summary||"";document.title=p.name+" — VoidFlame Labs";link($("actions"),"Download latest release ↓",github(p.release_url||p.releaseUrl),true);link($("actions"),"Source code ↗",github(p.source_url||p.sourceUrl));$("stats").append(el("span","","↓ "+Number(p.downloads||0).toLocaleString()+" downloads"),el("span","","Updated "+(p.updated_at||p.updatedAt||"unknown")));$("page").hidden=false;$("state").remove();render("overview")}catch(e){$("state").replaceChildren(el("strong","",e.message),el("p","muted","The project may not be published or the catalogue could not be loaded."));const a=el("a","btn primary","Back to discovery");a.href="./";$("state").append(a)}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>render(b.dataset.tab));load();
</script></body></html>
