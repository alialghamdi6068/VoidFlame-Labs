<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0e0e12">
<title>Project — VoidFlame Labs</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;background:#0e0e12;color:#f5f4fa;font:15px/1.7 'DM Sans',sans-serif}a{color:#c3afff;text-decoration:none}.wrap{max-width:1050px;margin:auto;padding:0 22px}.nav{height:70px;border-bottom:1px solid #ffffff12;display:flex;align-items:center;justify-content:space-between}.brand{font:700 19px 'Space Grotesk';color:#fff}.brand span{color:#a78bfa}.main{padding:35px 0 80px}.hero,.panel{border:1px solid #302d3a;background:#17171f;border-radius:18px;padding:clamp(18px,4vw,35px)}.hero{display:flex;gap:22px;align-items:flex-start;background:radial-gradient(ellipse at top right,#8962ef22,transparent 50%),#17171f}.logo{width:68px;height:68px;border-radius:18px;background:#a78bfa24;display:grid;place-items:center;font-size:30px;flex-shrink:0}.tag{font-size:11px;color:#c9b9ff;border:1px solid #4a3d61;border-radius:7px;padding:3px 8px}.title{font:700 clamp(28px,5vw,43px)/1.15 'Space Grotesk';letter-spacing:-1px;margin:12px 0 3px}.muted{color:#a19eaf;font-size:12px}.summary{color:#c8c5d3;margin-top:18px}.buttons{display:flex;flex-wrap:wrap;gap:9px;margin-top:18px}.btn{display:inline-block;border:1px solid #383542;border-radius:9px;background:#22212a;padding:9px 14px;font-size:12px;font-weight:700;color:#f8f4ff}.primary{background:linear-gradient(120deg,#b49bff,#9573ff);color:#181224;border:0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:18px;margin-top:18px}.panel h2{font:700 19px 'Space Grotesk';margin:0 0 12px}.description{white-space:pre-wrap;overflow-wrap:anywhere;color:#c6c3d1}.meta{display:flex;justify-content:space-between;gap:15px;padding:9px 0;border-bottom:1px solid #ffffff10;font-size:12px;color:#a19eaf}.meta strong{text-align:right;color:#f0edf6}.version{border-top:1px solid #ffffff12;padding:13px 0;display:flex;align-items:center;gap:12px}.version div{flex:1;min-width:0}.version strong,.version small{display:block;overflow-wrap:anywhere}.version small{font-size:11px;color:#a19eaf}.notice{padding:18px;border:1px dashed #393642;border-radius:12px;color:#a19eaf;font-size:12px}.error{text-align:center;padding:45px 15px;color:#a19eaf}.error strong{display:block;color:white;font-size:20px}footer{border-top:1px solid #ffffff12;padding:25px 0;color:#858294;font-size:11px}@media(max-width:760px){.layout{grid-template-columns:1fr}.hero{padding:20px;gap:14px}.logo{width:55px;height:55px;border-radius:14px;font-size:25px}}@media(max-width:450px){.hero{display:block}.logo{margin-bottom:15px}.buttons .btn{flex:1;text-align:center}.wrap{padding:0 13px}}
</style></head>
<body><header class="wrap nav"><a class="brand" href="./">VoidFlame <span>Labs</span></a><a href="./">← Browse projects</a></header><main class="wrap main" id="main"><div class="notice">Loading project…</div></main><footer><div class="wrap">VoidFlame Labs · Community projects for Minecraft</div></footer>
<script>
const main=document.getElementById('main');
const el=(tag,cls,txt)=>{const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n};
const safeUrl=value=>{try{const u=new URL(value);return u.protocol==='https:'&&u.hostname==='github.com'?u.href:''}catch{return ''}};
const meta=(label,value)=>{const row=el('div','meta');row.append(el('span','',label),el('strong','',value||'Not specified'));return row};
async function load(){const slug=new URLSearchParams(location.search).get('slug');if(!slug){showError('Project not specified');return}try{const res=await fetch('./data/projects.json',{cache:'no-store'});if(!res.ok)throw Error();const data=await res.json();const list=Array.isArray(data)?data:data.projects;const p=list.find(x=>String(x.slug||x.id||x.name)===slug);if(!p){showError('Project not found');return}document.title=(p.name||'Project')+' — VoidFlame Labs';main.replaceChildren();const crumb=el('p','muted','Discover / '+(p.category||'Other'));main.append(crumb);const hero=el('section','hero');const logo=el('div','logo',p.icon||'✦');const heading=el('div','');const tag=el('span','tag',p.category||'Other');heading.append(tag,el('h1','title',p.name||'Untitled project'),el('div','muted','by '+(p.author||'Community creator')),el('p','summary',p.summary||'No summary provided.'));const buttons=el('div','buttons');const release=safeUrl(p.releaseUrl),source=safeUrl(p.sourceUrl);if(release){const a=el('a','btn primary','Download latest release ↗');a.href=release;a.target='_blank';a.rel='noopener noreferrer';buttons.append(a)}else buttons.append(el('span','btn','No release available yet'));if(source){const a=el('a','btn','Source code ↗');a.href=source;a.target='_blank';a.rel='noopener noreferrer';buttons.append(a)}heading.append(buttons);hero.append(logo,heading);main.append(hero);const layout=el('div','layout'),about=el('section','panel'),info=el('aside','panel');about.append(el('h2','','About this project'),el('div','description',p.description||p.summary||'No full description provided.'),el('h2','','Versions & downloads'));const versions=Array.isArray(p.versions)?p.versions:[];if(!versions.length)about.append(el('div','notice','Version history will appear when version entries are added to the public catalogue. Use the release link above if available.'));for(const v of versions){const row=el('div','version'),text=el('div',''),name=el('strong','',v.version||v.name||'Version'),details=el('small','',(v.date||'')+(v.changelog?' · '+v.changelog:''));text.append(name,details);row.append(text,el('span','tag',v.channel||'Release'));const href=safeUrl(v.url||v.releaseUrl);if(href){const a=el('a','btn primary','Download');a.href=href;a.target='_blank';a.rel='noopener noreferrer';row.append(a)}about.append(row)}info.append(el('h2','','Project information'),meta('Category',p.category),meta('Creator',p.author),meta('Latest version',p.version),meta('Downloads',String(Number(p.downloads)||0)),meta('Supported versions',Array.isArray(p.supportedVersions)?p.supportedVersions.join(', '):''),meta('Updated',p.updatedAt));layout.append(about,info);main.append(layout)}catch(e){showError('Could not load project details')}}function showError(msg){main.replaceChildren();const box=el('section','error');box.append(el('strong','',msg),el('p','','This project may not be published or the catalogue could not be loaded.'),el('a','btn primary','Back to projects'));box.lastChild.href='./';main.append(box)}load();
</script></body></html>
