name: Deploy VoidFlame Labs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate GitHub catalogue
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/projects.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          projects = data if isinstance(data, list) else data.get("projects")
          if not isinstance(projects, list):
              raise SystemExit("data/projects.json must contain a projects array")
          required = ("name", "category", "summary")
          for index, project in enumerate(projects):
              if not isinstance(project, dict) or any(not isinstance(project.get(key), str) or not project[key].strip() for key in required):
                  raise SystemExit(f"Project entry {index} must include name, category, and summary")
          print(f"Catalogue valid: {len(projects)} approved project(s)")
          PY
      - name: Validate D1 migrations and constraints
        run: python3 worker/tests/test_schema.py
      - name: Check security contracts
        run: python3 worker/tests/test_security_contract.py
      - name: Check JavaScript syntax
        run: |
          python3 - <<'PY'
          import pathlib, re, subprocess
          index = 0
          for html_path in pathlib.Path(".").glob("*.html"):
              html = html_path.read_text(encoding="utf-8")
              scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
              for script in scripts:
                  if script.strip():
                      path = pathlib.Path(f"/tmp/inline-{index}.js")
                      path.write_text(script, encoding="utf-8")
                      subprocess.run(["node", "--check", str(path)], check=True)
                      index += 1
          subprocess.run(["node", "--check", "worker/src/index.js"], check=True)
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
