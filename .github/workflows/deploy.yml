name: Deploy VoidFlame Labs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Generate browser configuration
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Supabase Actions variables are not configured. The public site will deploy in preview mode; sign-in, publishing, live projects, and downloads will remain disabled until both variables are added."
          fi
          node <<'NODE'
          const fs = require('node:fs');
          const config = {
            supabaseUrl: process.env.SUPABASE_URL || '',
            supabaseAnonKey: process.env.SUPABASE_ANON_KEY || '',
            ownerEmail: 'alialghamdi6068@gmail.com'
          };
          fs.writeFileSync('config.js', 'window.VOIDFLAME_CONFIG = ' + JSON.stringify(config) + ';\n');
          NODE
      - name: Check JavaScript syntax
        run: |
          node --check auth.js
          node --check staff-tools.js
          node --check account-auth.js
          python3 - <<'PY'
          import pathlib, re, subprocess
          html = pathlib.Path("index.html").read_text()
          scripts = re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>", html, re.I)
          for index, script in enumerate(scripts):
              if script.strip():
                  path = pathlib.Path(f"/tmp/inline-{index}.js")
                  path.write_text(script)
                  subprocess.run(["node", "--check", str(path)], check=True)
          PY
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
