name: Submit a project
description: Submit a Minecraft project for review and listing on VoidFlame Labs.
title: "[Project submission]: "
labels: ["project-submission"]
body:
  - type: markdown
    attributes:
      value: |
        Submissions are reviewed by the VoidFlame Labs maintainers. Upload release files to a GitHub Release first and provide its URL below. Do not attach private credentials or secrets.
  - type: input
    id: project_name
    attributes:
      label: Project name
      placeholder: Example Project
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Category
      options:
        - Plugins
        - Mods
        - Modpacks
        - Shaders
        - Resource Packs
        - Tools
        - Other
    validations:
      required: true
  - type: input
    id: short_description
    attributes:
      label: Short description
      description: One sentence shown on the project card.
      placeholder: What does this project do?
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Full description
      description: Features, installation instructions, dependencies, and known limitations.
      render: markdown
    validations:
      required: true
  - type: input
    id: supported_versions
    attributes:
      label: Minecraft versions
      placeholder: "1.21.1, 1.21.4"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Loader / platform
      placeholder: Paper, Fabric, NeoForge, Vanilla
    validations:
      required: true
  - type: input
    id: source_url
    attributes:
      label: Source repository URL
      placeholder: https://github.com/owner/project
    validations:
      required: true
  - type: input
    id: release_url
    attributes:
      label: GitHub Release URL
      description: Must point to a public release with downloadable files.
      placeholder: https://github.com/owner/project/releases/tag/1.0.0
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Release version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: changelog
    attributes:
      label: Changelog
      description: Summarize what changed in this release.
      render: markdown
    validations:
      required: false
