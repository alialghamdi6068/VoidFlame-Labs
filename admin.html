<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Moderation — VoidFlame Labs</title><style>
:root{color-scheme:dark;--bg:#101012;--line:#303039;--text:#f4f2f8;--muted:#aaa7b5;--purple:#a78bfa;--mint:#8fe5c0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 0,#2b1d40,transparent 40%),var(--bg);color:var(--text);font:15px/1.6 system-ui,sans-serif}a{color:inherit;text-decoration:none}button,.btn{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:#222229;color:var(--text);padding:9px 12px}.primary{background:var(--purple);color:#17121f;border:0;font-weight:750}.danger{color:#ffabb5;border-color:#ff8b9b55}.shell{width:min(1100px,calc(100% - 32px));margin:auto}header{height:70px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff12}.brand{font-weight:850}.mark{background:var(--purple);color:#17121f;border-radius:9px;padding:6px 10px;margin-right:8px}.muted{color:var(--muted)}.intro{padding:32px 0 18px}.intro h1{font-size:clamp(30px,5vw,42px);margin:4px 0;letter-spacing:-1.4px}.kicker{font-size:11px;font-weight:800;letter-spacing:1.5px;color:var(--mint)}.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}.tabs{margin-bottom:15px}.tabs .active{border-color:var(--purple);background:#a78bfa19}.panel{border:1px solid var(--line);border-radius:15px;background:#19191edb;padding:20px;margin-bottom:14px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}.top h2,.top h3{margin:0}.item{border:1px solid var(--line);border-radius:12px;padding:15px;margin:10px 0;background:#202027}.pill{font-size:11px;padding:3px 8px;border-radius:7px;background:#a78bfa15;border:1px solid #a78bfa40}.status{color:var(--mint);min-height:22px}.error{color:#ff9ca9}.notice{padding:18px;border:1px dashed #494652;border-radius:12px;color:var(--muted)}.small{font-size:12px;color:var(--muted)}@media(max-width:650px){.panel{padding:14px}}
</style><script src="./config.js"></script></head><body><header class="shell"><a class="brand" href="./"><span class="mark">V</span>VoidFlame Labs / Moderation</a><a href="./developer.html">Developer Studio</a></header><main class="shell"><div class="intro"><div class="kicker">TRUST & SAFETY</div><h1>Moderation console</h1><div class="muted">Review submissions and resolve reports. Permissions are checked server-side.</div></div><div id="banner" class="notice">Connecting…</div><div class="tabs"><button class="active" data-tab="pending">Pending projects</button><button data-tab="reports">Reports</button><button data-tab="comments">Comments</button><button data-tab="audit">Audit log</button></div><section class="panel"><div class="top"><h2 id="title">Pending projects</h2><button id="refresh">Refresh</button></div><p id="status" class="status"></p><div id="list" class="notice">Loading…</div></section></main><script>
const API=(window.VOIDFLAME_CONFIG?.apiBaseUrl||"").replace(/\/$/,""),$=id=>document.getElementById(id);let tab="pending";
async function api(path,opts={}){if(!API)throw Error("API URL is not configured in config.js");const headers={...(opts.headers||{})};if(typeof opts.body==="string")headers["content-type"]="application/json";const r=await fetch(API+path,{credentials:"include",...opts,headers}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed");return d}
function button(label,cls,fn){const b=document.createElement("button");b.textContent=label;b.className=cls||"";b.onclick=fn;return b}
function render(rows){const root=$("list");root.replaceChildren();if(!rows.length){root.className="notice";root.textContent="Nothing to review.";return}root.className="";rows.forEach(x=>{const n=document.createElement("article");n.className="item";const top=document.createElement("div");top.className="top";const h=document.createElement("h3");h.textContent=tab==="pending"?x.name:tab==="comments"?(x.body||"Comment"):tab==="audit"?(x.action||"Audit event"):(x.reason||"Community report");const tag=document.createElement("span");tag.className="pill";tag.textContent=x.status||tab;top.append(h,tag);n.append(top);const p=document.createElement("p");p.className="muted";p.textContent=tab==="pending"?(x.summary||"")+" · by @"+(x.author||"unknown"):tab==="comments"?(x.project_name||"Project")+" · by @"+(x.username||"unknown"):tab==="audit"?"Actor: @"+(x.actor||"unknown")+" · "+(x.target_type||"")+" "+(x.target_id||"")+" · "+(x.details||""): (x.details||"No details")+" · reporter @"+(x.reporter||"unknown")+(x.project_name?" · "+x.project_name:"");n.append(p);if(x.created_at){const sm=document.createElement("div");sm.className="small";sm.textContent=x.created_at;n.append(sm)}const row=document.createElement("div");row.className="row";row.style.marginTop="12px";if(tab==="pending")row.append(button("Approve","primary",()=>change("/api/admin/projects/"+encodeURIComponent(x.id),"approved")),button("Reject","danger",()=>change("/api/admin/projects/"+encodeURIComponent(x.id),"rejected")),button("Archive","",()=>change("/api/admin/projects/"+encodeURIComponent(x.id),"archived")));else if(tab==="reports")row.append(button("Review","",()=>change("/api/admin/reports/"+encodeURIComponent(x.id),"reviewing")),button("Resolve","primary",()=>change("/api/admin/reports/"+encodeURIComponent(x.id),"resolved")),button("Dismiss","danger",()=>change("/api/admin/reports/"+encodeURIComponent(x.id),"dismissed")));else if(tab==="comments")row.append(button("Hide comment","danger",()=>change("/api/admin/comments/"+encodeURIComponent(x.id),"hidden")));if(row.children.length)n.append(row);root.append(n)})}
async function load(){if(!API){$("banner").textContent="Configure config.js and deploy the Worker first.";return}try{const me=await api("/api/me");if(!me.user){$("banner").replaceChildren(document.createTextNode("Sign in with GitHub. "));const a=document.createElement("a");a.href=API+"/api/auth/github";a.className="btn primary";a.textContent="Sign in";$("banner").append(a);return}if(!["admin","moderator"].includes(me.user.role))throw Error("Your account does not have moderation permissions.");$("banner").textContent="Signed in as @"+me.user.username+" · "+me.user.role;const endpoint={pending:"/api/admin/projects?status=pending",reports:"/api/admin/reports",comments:"/api/admin/comments?status=visible",audit:"/api/admin/audit"}[tab];const d=await api(endpoint);render((d.projects||d.reports||d.comments||d.events||[]));$("title").textContent={pending:"Pending projects",reports:"Community reports",comments:"Community comments",audit:"Administrative audit log"}[tab]}catch(e){$("banner").textContent=e.message;$("list").textContent="Unable to load moderation data."}}
async function change(path,status){if(!confirm("Change status to "+status+"?"))return;try{await api(path,{method:"PATCH",body:JSON.stringify({status})});$("status").textContent="Updated.";await load()}catch(e){$("status").textContent=e.message;$("status").className="status error"}}
document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));load()});$("refresh").onclick=load;load();
</script></body></html>
