name = "voidflame-labs-api"
main = "src/index.js"
compatibility_date = "2026-10-17"
workers_dev = true

[vars]
SITE_URL = "https://alialghamdi6068.github.io/VoidFlame-Labs"
API_URL = "https://REPLACE_WITH_WORKER_HOST"

[[d1_databases]]
binding = "DB"
database_name = "voidflame-labs"
database_id = "REPLACE_WITH_CLOUDFLARE_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "voidflame-labs-files"

# Cloudflare-native per-IP request limits. These execute before D1 work.
# Pair with Cloudflare Security > WAF/rate-limiting rules for edge protection.
[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1001"
simple = { limit = 300, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1002"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }
